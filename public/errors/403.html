<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>403 — Access Denied | Vihanga</title>
  <link rel="icon" type="image/png" href="/favicon-32x32.png" />
  <style>
    :root {
      --brand: #837f39;
      --brand-dark: #6b672f;
      --text: #1f2937;
      --muted: #6b7280;
      --bg: #f5f4ef;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #f8f7f2 0%, #eceae1 100%);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--brand);
      text-decoration: none;
    }

    .code {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(131, 127, 57, 0.12);
      color: var(--brand-dark);
      font-size: 14px;
      font-weight: 600;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-primary {
      background: var(--brand);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--brand-dark);
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #f9fafb;
    }

    .footer {
      margin-top: 28px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <a class="logo" href="https://hr.vihanga.io/" aria-label="Vihanga home">Vihanga</a>
    <div class="code">403</div>
    <h1>Access denied</h1>
    <p>
      You do not have permission to view this page, or access is restricted from your
      current location or network. If you believe this is a mistake, please contact your
      HR administrator.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="https://hr.vihanga.io/">Go to homepage</a>
      <a class="btn btn-secondary" href="mailto:vihangasupport@gmail.com">Contact support</a>
    </div>
    <p class="footer">hr.vihanga.io</p>
  </main>
</body>
</html>
